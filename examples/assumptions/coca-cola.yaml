# Illustrative scenario assumptions for The Coca-Cola Company (not investment advice).
# Rates are decimals. Five explicit years; the last tax rate must equal the marginal rate.
marginal_tax_rate: 0.25
scenarios:
  bear:
    probability: 0.25
    revenue_growth: [0.02, 0.02, 0.025, 0.025, 0.025]
    operating_margin: [0.27, 0.27, 0.27, 0.27, 0.27]
    sales_to_capital: [0.75, 0.75, 0.75, 0.75, 0.75]
    tax_rate: [0.19, 0.20, 0.22, 0.24, 0.25]
    terminal_growth: 0.02
    terminal_roic: 0.12
    narrative: Volume pressure and pricing fatigue keep growth near inflation.
  base:
    probability: 0.5
    revenue_growth: [0.05, 0.05, 0.045, 0.04, 0.035]
    operating_margin: [0.29, 0.295, 0.30, 0.30, 0.30]
    sales_to_capital: [0.8, 0.8, 0.8, 0.8, 0.8]
    tax_rate: [0.19, 0.20, 0.22, 0.24, 0.25]
    terminal_growth: 0.03
    terminal_roic: 0.15
    narrative: Steady pricing and emerging-market volume; margins near recent levels.
  bull:
    probability: 0.25
    revenue_growth: [0.07, 0.065, 0.06, 0.05, 0.045]
    operating_margin: [0.30, 0.31, 0.31, 0.32, 0.32]
    sales_to_capital: [0.85, 0.85, 0.85, 0.85, 0.85]
    tax_rate: [0.19, 0.20, 0.22, 0.24, 0.25]
    terminal_growth: 0.035
    terminal_roic: 0.18
    narrative: Premiumisation and refranchising lift margins and returns.
