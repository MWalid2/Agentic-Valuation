repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Mypy type check
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
